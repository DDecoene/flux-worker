[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flux-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "python-dotenv>=1.0",
    "diffusers>=0.21.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "Pillow>=9.0",
    "safetensors>=0.3.0",
    "accelerate>=1.13.0",
    "torchvision>=0.26.0",
]

[project.scripts]
flux-worker = "flux_worker.cli:cli"
